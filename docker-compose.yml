services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aleppo-real-estate-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - UseInMemoryDatabase=false
      - DatabaseProvider=PostgreSQL
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=aleppo_real_estate;Username=postgres;Password=YourPostgresSecretPassword123!
      - JwtSettings__Secret=YourSuperSecretKeyForAleppoRealEstatePlatformMustBe32BytesLong!
      - JwtSettings__Issuer=AleppoRealEstateAPI
      - JwtSettings__Audience=AleppoRealEstateClient
      - AllowedHosts=localhost;127.0.0.1;app
      - Cors__AllowedOrigins__0=http://localhost:8080
      - Database__ApplyMigrationsOnStartup=true
    volumes:
      - property_uploads:/app/wwwroot/uploads/properties
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: aleppo-real-estate-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=aleppo_real_estate
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourPostgresSecretPassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aleppo_real_estate"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aleppo-real-estate-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@aleppo.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  property_uploads:
