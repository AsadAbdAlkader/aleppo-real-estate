<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>عقارات حلب — Aleppo Real Estate</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="منصة عقارات حلب الفاخرة — بيع وشراء وإيجار العقارات في أرقى أحياء حلب">
  <meta name="theme-color" content="#191712">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Tajawal:wght@300;400;500;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <!-- Syrian Heritage Zero-FOUC Pre-boot Theme Engine -->
  <script>
    (function() {
      try {
        var storedMode = localStorage.getItem('aleppo_theme');
        var storedId = localStorage.getItem('aleppo_theme_id');
        var storedFamily = localStorage.getItem('aleppo_theme_family') || 'emerald-luxury';
        var isDark = storedMode === 'dark' || (!storedMode && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var activeThemeId = storedId || (storedFamily + '-' + (isDark ? 'dark' : 'light'));
        
        var root = document.documentElement;
        root.setAttribute('data-theme', activeThemeId);
        if (isDark) {
          root.classList.add('dark');
          root.style.colorScheme = 'dark';
        } else {
          root.classList.remove('dark');
          root.style.colorScheme = 'light';
        }
      } catch (e) {
        /* Fail-safe fallback */
      }
    })();
  </script>
</head>
<body class="bg-stone-50 text-slate-900 font-sans antialiased">
  <app-root></app-root>
  <script type="module" src="main.js"></script>
</body>
</html>
