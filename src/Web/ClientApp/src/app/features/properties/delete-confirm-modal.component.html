@if (isOpen() && property()) {
  <div class="fixed inset-0 z-50 overflow-y-auto" dir="rtl">
    <!-- Backdrop overlay -->
    <div
      class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"
      (click)="onClose()"
    ></div>

    <!-- Modal Container -->
    <div class="flex min-h-full items-center justify-center p-4 text-center">
      <div
        class="relative transform overflow-hidden rounded-2xl bg-white text-right shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-md border border-slate-100 p-6 space-y-6"
        (click)="$event.stopPropagation()"
      >
        <!-- Icon & Warning Header -->
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center shrink-0 shadow-inner">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </div>
          <div>
            <h3 class="text-lg font-extrabold text-slate-900">تأكيد حذف العقار</h3>
            <p class="text-xs text-slate-500 mt-0.5">يرجى تأكيد العملية قبل المتابعة</p>
          </div>
        </div>

        <!-- Confirmation Text -->
        <div class="bg-rose-50/60 border border-rose-100 rounded-xl p-4 text-sm text-slate-700 leading-relaxed">
          هل أنت تأكد من رغبتك في حذف العقار
          <span class="font-bold text-slate-900">"{{ property()?.title }}"</span>؟
          سيتم إزالة هذا العقار بشكل دائم ولا يمكن التراجع عن هذا الإجراء.
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-3 pt-2">
          <button
            type="button"
            (click)="onClose()"
            [disabled]="deleting()"
            class="px-5 py-2.5 text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition-all disabled:opacity-50"
          >
            إلغاء
          </button>
          <button
            type="button"
            (click)="onConfirm()"
            [disabled]="deleting()"
            class="px-5 py-2.5 text-sm font-bold text-white bg-rose-600 hover:bg-rose-700 active:bg-rose-800 rounded-xl shadow-md shadow-rose-600/25 transition-all flex items-center gap-2 disabled:opacity-50"
          >
            @if (deleting()) {
              <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>جاري الحذف...</span>
            } @else {
              <span>تأكيد الحذف</span>
            }
          </button>
        </div>
      </div>
    </div>
  </div>
}
