<div class="relative inline-flex items-center">
  <!-- Luxury Syrian Mode Toggle Pill -->
  <button
    (click)="toggleMode()"
    type="button"
    class="group relative inline-flex items-center gap-2 px-3 py-1.5 rounded-full border transition-all duration-300 shadow-sm cursor-pointer
           bg-amber-500/10 hover:bg-amber-500/20 border-amber-600/30 text-amber-900
           dark:bg-amber-400/10 dark:hover:bg-amber-400/20 dark:border-amber-400/30 dark:text-amber-200"
    [attr.aria-label]="themeService.isDark() ? 'التبديل إلى الوضع النهاري' : 'التبديل إلى الوضع الليلي'"
    [title]="themeService.isDark() ? 'التبديل إلى الوضع النهاري (إيفوري الشام)' : 'التبديل إلى الوضع الليلي (فحم حلب الفاخر)'"
  >
    <span
      class="flex items-center justify-center w-6 h-6 rounded-full transition-transform duration-500 transform group-hover:rotate-45
             bg-amber-400/20 dark:bg-amber-400/20 text-amber-700 dark:text-amber-300 text-sm"
    >
      {{ themeService.isDark() ? '☀️' : '🌙' }}
    </span>
    <span class="text-xs font-bold font-hayyakum tracking-normal select-none">
      {{ themeService.isDark() ? 'نهاري' : 'ليلي' }}
    </span>
  </button>
</div>
