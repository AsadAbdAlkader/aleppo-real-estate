<div class="relative inline-flex items-center">
  <!-- Main Mode Toggle Pill -->
  <div class="inline-flex items-center rounded-full bg-white/5 hover:bg-white/10 border border-amber-500/30 p-0.5 shadow-sm transition-all">
    <button
      (click)="toggleMode()"
      type="button"
      class="flex items-center justify-center w-7 h-7 sm:w-8 sm:h-8 rounded-full text-amber-300 hover:text-amber-200 transition-all hover:scale-110 active:scale-95 cursor-pointer"
      [attr.aria-label]="themeService.isDark() ? 'تفعيل الوضع النهاري' : 'تفعيل الوضع الليلي الفاخر'"
      [title]="themeService.isDark() ? 'التبديل إلى الوضع النهاري' : 'التبديل إلى الوضع الليلي الفاخر'"
    >
      <span class="text-sm sm:text-base transition-transform duration-300" [class.rotate-180]="themeService.isDark()">
        {{ themeService.isDark() ? '☀️' : '🌙' }}
      </span>
    </button>

    <!-- Theme Palette Selector Trigger -->
    <button
      (click)="toggleMenu($event)"
      type="button"
      class="flex items-center justify-center w-5 h-7 pr-1 pl-1.5 text-[10px] text-amber-400/80 hover:text-amber-300 transition-colors cursor-pointer border-r border-amber-500/20"
      title="اختيار نمط الهوية اللونية"
      aria-label="قائمة أنماط الهوية السورية"
    >
      <span>▼</span>
    </button>
  </div>

  <!-- Palette Dropdown Menu -->
  @if (isMenuOpen()) {
    <div
      class="absolute left-0 top-full mt-2 w-52 rounded-2xl bg-ink-950/95 dark:bg-[#18140d]/95 backdrop-blur-xl border border-amber-500/30 shadow-2xl z-50 p-2 text-right animate-fadeIn"
      (click)="$event.stopPropagation()"
    >
      <div class="px-2.5 py-1 text-[11px] font-bold text-amber-300/90 border-b border-amber-500/15 mb-1">
        🎨 هويات التراث السوري:
      </div>
      <div class="space-y-0.5">
        @for (item of families; track item.id) {
          <button
            (click)="selectFamily(item.id, $event)"
            type="button"
            class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-xl text-xs transition-colors cursor-pointer"
            [class.bg-amber-500/20]="themeService.themeFamily() === item.id"
            [class.text-amber-200]="themeService.themeFamily() === item.id"
            [class.font-bold]="themeService.themeFamily() === item.id"
            [class.text-slate-300]="themeService.themeFamily() !== item.id"
            [class.hover:bg-white/10]="themeService.themeFamily() !== item.id"
          >
            <span class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full border border-white/30" [style.backgroundColor]="item.color"></span>
              <span>{{ item.nameAr }}</span>
            </span>
            @if (themeService.themeFamily() === item.id) {
              <span class="text-amber-400 text-xs">✓</span>
            }
          </button>
        }
      </div>
    </div>
  }
</div>
